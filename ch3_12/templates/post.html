{% extends "best.html" %}
{% block title %}
<title>學生資料管理系統 - 新增學生資料</title>
<style>
  h1, h3 {
      text-align: center;
  }
  table {
      margin-left: auto;
      margin-right: auto;
  }
  .head_content {
      margin-bottom: 40px;
  }
</style>
{% endblock %}
{% block content %}
<div>
    <h1>學生資料管理系統 - 新增學生資料</h1>
    {% comment  %} <h3><a href='/index/'>回首頁</a></h3> {% endcomment %}
    <h3><a href='{% url 'index' %}'>回首頁</a></h3>
</div>
<div>
    <form action='{% url 'post' %}' method='post'>
      {% csrf_token %}
      <table>
        <tr>
          <th>name:</th>
          <td><input type='text' id='cname' name='cname' placeholder='請輸入姓名' required> </td>
        </tr>
        <tr>
          <th>sex:</th>
          <td>
            <input type='radio' id='male' name='csex' value='M' required>
            <label for='male'>男</label>
            <input type='radio' id='female' name='csex' value='F' required>
            <label for='female'>女</label>
          </td>
        </tr> 
        <tr>
          <th>birthday:</th>
          <td><input type='date' id='cbirthday' name='cbirthday' required> </td>
        </tr>
        <tr>  
        <th>email:</th>
          <td><input type='email' id='cemail' name='cemail' placeholder='請輸入電子郵件'      required> </td>
        </tr>
        <tr>
          <th>tel:</th>
          <td><input type='text' id='cphone' name='cphone' placeholder='請輸入電話號碼' required> </td>
        </tr>
        <tr>
          <th>address:</th>
          <td><input type='text' id='caddr' name='caddr' placeholder='請輸入地址' required> </td>
        </tr>
        <tr>
          <th colspan='2' >
              <input type='submit' name='submit' id='submit' value='儲存'>
              <input type='reset' name='reset' id='reset' value='清除'>
          </th>
        </tr>
      </table>
    </form>
</div>
{% endblock %}

{% extends "best.html" %}
{% block title %}<title>新增學生資料</title>{% endblock %}
{% block content %}
<div class="form-wrap">
  <div class="mb-4">
    <a class="link-secondary text-decoration-none" href="{% url 'index' %}"><i class="bi bi-arrow-left me-1"></i>返回學生列表</a>
    <h1 class="h3 text-primary mt-3 mb-1">新增學生資料</h1>
    <p class="text-secondary mb-0">請填寫學生的基本聯絡資料。</p>
  </div>
  <form action="{% url 'post' %}" method="post" class="row g-3">
    {% csrf_token %}
    <div class="col-md-6"><label class="form-label" for="cname">姓名</label><input class="form-control" type="text" id="cname" name="cname" placeholder="請輸入姓名" required></div>
    <fieldset class="col-md-6"><legend class="form-label">性別</legend><div class="d-flex gap-4 pt-2"><div class="form-check"><input class="form-check-input" type="radio" id="male" name="csex" value="M" required><label class="form-check-label" for="male">男</label></div><div class="form-check"><input class="form-check-input" type="radio" id="female" name="csex" value="F" required><label class="form-check-label" for="female">女</label></div></div></fieldset>
    <div class="col-md-6"><label class="form-label" for="cbirthday">生日</label><input class="form-control" type="date" id="cbirthday" name="cbirthday" required></div>
    <div class="col-md-6"><label class="form-label" for="cemail">電子郵件</label><input class="form-control" type="email" id="cemail" name="cemail" placeholder="name@example.com" required></div>
    <div class="col-md-6"><label class="form-label" for="cphone">電話</label><input class="form-control" type="tel" id="cphone" name="cphone" placeholder="請輸入電話號碼" required></div>
    <div class="col-md-6"><label class="form-label" for="caddr">地址</label><input class="form-control" type="text" id="caddr" name="caddr" placeholder="請輸入地址" required></div>
    <div class="col-12 d-flex justify-content-end gap-2 pt-3 border-top"><button class="btn btn-outline-secondary" type="reset">清除</button><button class="btn btn-primary" type="submit"><i class="bi bi-check-lg me-1"></i>儲存資料</button></div>
  </form>
</div>
{% endblock %}

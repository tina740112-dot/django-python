{% load static %}
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% block title %}Best{% endblock %}
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-body-tertiary">
  <nav class="navbar navbar-expand-md bg-primary shadow-sm" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{% url 'index' %}">
        <i class="bi bi-mortarboard-fill me-2"></i>學生資料管理
      </a>
      <div class="d-flex gap-2">
        <a class="btn btn-sm btn-outline-light" href="{% url 'search_name' %}">
          <i class="bi bi-search me-1"></i>搜尋
        </a>
        <a class="btn btn-sm btn-light text-primary" href="{% url 'post' %}">
          <i class="bi bi-person-plus-fill me-1"></i>新增學生
        </a>
      </div>
    </div>
  </nav>
  <main class="container py-4 py-lg-5">
    <div class="page-content bg-white border rounded-3 shadow-sm p-3 p-md-4">
      {% block content %}{% endblock %}
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
